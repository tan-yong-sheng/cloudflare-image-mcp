version: 2.1

# Fast per-push gate for feature PRs: install cache + strict typecheck +
# format check + pure-logic unit tests. No deployment, no browsers,
# no secrets — this is the entire <3 min trick.

executors:
  node-executor:
    docker:
      - image: cimg/node:24.18
    working_directory: ~/project
    resource_class: medium

commands:
  setup-node:
    description: "Setup Node.js and restore cache"
    steps:
      - restore_cache:
          keys:
            - workers-deps-{{ checksum "workers/package-lock.json" }}
            - client-deps-{{ checksum "client/package-lock.json" }}
      - run:
          name: Install workers dependencies
          command: cd workers && npm ci
      - run:
          name: Install client dependencies
          command: cd client && npm ci
      - save_cache:
          key: workers-deps-{{ checksum "workers/package-lock.json" }}
          paths:
            - workers/node_modules
      - save_cache:
          key: client-deps-{{ checksum "client/package-lock.json" }}
          paths:
            - client/node_modules

jobs:
  fast:
    executor: node-executor
    steps:
      - checkout

      - run:
          name: Agent doc pointers
          # Agent docs are context pointers: a path that does not exist makes
          # the agent conclude the material is absent rather than mis-filed,
          # which is how docs/adr/ hid the ADRs after they moved. Needs no
          # dependencies, so it runs before the installs and fails fast.
          command: node scripts/check-agent-doc-paths.mjs

      - setup-node

      - run:
          name: Type check
          working_directory: workers
          command: npm run check

      - run:
          name: Client type check
          working_directory: client
          command: npm run check

      - run:
          name: Client build
          # The build is part of the gate: a client that does not bundle is
          # a client that cannot be deployed, and the deploy workflow builds
          # the same output.
          working_directory: client
          command: npm run build

      - run:
          name: Client unit tests
          working_directory: client
          command: npm test

      - run:
          name: Client format check
          working_directory: client
          # The whole client tree is new, so a blanket check is affordable
          # here; the workers tree predates the repo formatter config and
          # keeps its scoped check.
          # --no-install: prettier is a pinned dev dependency of this
          # package, so the gate uses the version in the lockfile instead
          # of fetching whatever npx considers current.
          command: npx --no-install prettier --check "src/**/*.{ts,tsx,css}" "*.{ts,js,json,html}"

      - run:
          name: Format check
          working_directory: workers
          # Scoped to files this pipeline owns: pre-existing sources predate
          # the repo formatter config and would fail a blanket check. The
          # test-support directory and tsconfigs are included because the
          # D1 migration harness and its config landed formatter-clean.
          # --no-install: prettier is a pinned dev dependency of this
          # package, so the gate uses the version in the lockfile instead
          # of fetching whatever npx considers current.
          command: npx --no-install prettier --check "src/**/*.test.ts" "src/test-utils/**/*.ts" "tsconfig*.json" "package.json" "../.circleci/pr-checks.yml"

      - run:
          name: Unit tests
          working_directory: workers
          command: npm test

      - run:
          name: Version consistency
          # Mechanical guard for the release version: workers/package.json is
          # the declared source (tag-release.yml mints tags from it) and
          # src/version.ts mirrors it for runtime surfaces (/health, MCP
          # metadata). Fail the PR if they disagree. Lockfile root follows
          # via npm install; root/e2e manifests are intentionally independent.
          working-directory: workers
          command: |
            PKG="$(node -p "require('./package.json').version")"
            SRC="$(node -p "require('fs').readFileSync('src/version.ts','utf8').match(/WORKER_VERSION = \"([^\"]+)\"/)[1]")"
            if [ "$PKG" != "$SRC" ]; then
              echo "❌ ERROR: version skew: package.json ($PKG) != src/version.ts ($SRC) — bump both in the same PR"
              exit 1
            fi
            echo "✅ Version consistent: $PKG"

workflows:
  version: 2
  pr-checks:
    jobs:
      - fast:
          filters:
            branches:
              only:
                - main
