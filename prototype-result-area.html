<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PR #61 Result-Area Prototype — before vs after</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
      body {
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .mockimg {
        width: 100%;
        height: 220px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        color: #fff;
        border-radius: 0.5rem;
      }
      .old-img {
        background: #6b7280;
      }
      .new-img {
        background: #059669;
      }
      .broken-img {
        background: repeating-linear-gradient(
          45deg,
          #7f1d1d,
          #7f1d1d 10px,
          #991b1b 10px,
          #991b1b 20px
        );
      }
      .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        border-radius: 0.5rem;
        font-weight: 600;
      }
      .frame {
        position: relative;
        border: 1px solid #e2e8f0;
        border-radius: 0.5rem;
        padding: 0.5rem;
        min-height: 240px;
      }
      .meta {
        font-size: 0.8rem;
        color: #475569;
      }
      .err {
        font-size: 0.8rem;
        color: #dc2626;
      }
      .variantbar {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: #0f172a;
        color: #fff;
        padding: 0.6rem 1rem;
        display: flex;
        gap: 0.5rem;
        align-items: center;
        z-index: 50;
      }
      .variantbar button {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 0.4rem;
        padding: 0.3rem 0.7rem;
        font-size: 0.8rem;
      }
      .variantbar button.on {
        background: #059669;
        border-color: #059669;
      }
      .stateline {
        font-family: ui-monospace, monospace;
        font-size: 0.72rem;
        background: #0f172a;
        color: #a5f3fc;
        border-radius: 0.4rem;
        padding: 0.5rem 0.7rem;
        margin-top: 0.5rem;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body class="max-w-5xl mx-auto px-4 py-8 pb-24">
    <h1 class="text-2xl font-extrabold">
      PR #61 — result-area behavior: before vs after
    </h1>
    <p class="text-sm text-gray-600">
      PROTOTYPE — throwaway, answers “what changes for the user?”. Scenarios are
      scripted (no network). Variant via
      <span style="font-family: monospace">?v=before|after|error|stall</span> +
      bar below.
    </p>

    <div id="variants"></div>

    <script>
      const SCENARIOS = {
        before: {
          title:
            "BEFORE — error discards good image, stale meta, no stall guard",
          desc: "Old flow: start hides image; error re-shows empty placeholder (good output gone); model/time stay stale under spinner; button never disables (double-submit races); stall spins forever.",
        },
        after: {
          title: "AFTER — keeps last good image, fresh meta, abort recovery",
          desc: "New flow: prior image stays under overlay; stale meta cleared to …; button disabled during load; error restores prior src+meta; 120s AbortController recovery with timeout message.",
        },
        error: {
          title: "AFTER, error path — prior image restored",
          desc: "Simulated failed load with a prior result: overlay clears, prior image + meta restored, inline error shown, button re-enabled. Compare with BEFORE where the placeholder returns and output is lost.",
        },
        stall: {
          title: "AFTER, stall path — abort recovery",
          desc: "Simulated 120s stall: fetch aborted, button re-enabled, 'timed out after 120s — please retry' inline error. BEFORE had no terminal path (spinner forever, button dead).",
        },
      };
      const order = ["before", "after", "error", "stall"];
      let v = new URLSearchParams(location.search).get("v") || "after";
      if (!order.includes(v)) v = "after";

      function renderBar() {
        const bar = document.createElement("div");
        bar.className = "variantbar";
        bar.innerHTML =
          "<span style='font-size:.8rem'>Variant:</span>" +
          order
            .map(
              (k) =>
                `<button data-v="${k}" class="${k === v ? "on" : ""}">${k}</button>`
            )
            .join("") +
          "<span style='font-size:.75rem;color:#94a3b8'>state printed below each frame</span>";
        bar.querySelectorAll("button").forEach(
          (b) =>
            (b.onclick = () => {
              const u = new URL(location.href);
              u.searchParams.set("v", b.dataset.v);
              location.href = u;
            })
        );
        document.body.appendChild(bar);
      }

      function stateLine(s) {
        return `image: ${s.image} | overlay: ${s.overlay} | button: ${s.button} | meta: ${s.meta} | error: ${s.error}`;
      }

      function frame(sc) {
        const d = document.createElement("div");
        d.className = "bg-white rounded-xl shadow p-4 mb-4";
        let body = "";
        if (v === "before") {
          body = `<div class="frame"><div class="mockimg broken-img">BROKEN (old image lost)</div></div>
      <p class="meta">Model: sdxl-base · Time: 12.4s (STALE — from prior run, never cleared)</p>
      <p class="err">Error: Generation failed</p>
      <p class="meta">Generate button: ENABLED throughout (double-click races; last src wins)</p>
      <div class="stateline">${stateLine({ image: "broken/empty (prior URL lost)", overlay: "hidden", button: "enabled (never disabled)", meta: "stale, never cleared", error: "alert()-era inline text" })}</div>`;
        } else if (v === "after") {
          body = `<div class="frame"><div class="mockimg old-img">PRIOR IMAGE (kept under overlay)</div><div class="overlay">Generating… (button disabled)</div></div>
      <p class="meta">Model: … · Time: … (cleared at start, no stale values)</p>
      <div class="stateline">${stateLine({ image: "prior kept, overlay covers", overlay: "shown", button: "disabled", meta: "…/… (cleared)", error: "none" })}</div>`;
        } else if (v === "error") {
          body = `<div class="frame"><div class="mockimg old-img">PRIOR IMAGE (restored: src+meta)</div></div>
      <p class="meta">Model: flux-1-schnell · Time: 4.2s (restored prior values)</p>
      <p class="err">Could not load the generated image (expired or blocked URL)</p>
      <p class="meta">Generate button: re-enabled · placeholder NOT shown (hadResult)</p>
      <div class="stateline">${stateLine({ image: "prior restored (restoring flag skips commit)", overlay: "hidden", button: "re-enabled", meta: "restored prior", error: "inline, role=alert" })}</div>`;
        } else {
          body = `<div class="frame"><div class="mockimg old-img">PRIOR IMAGE (untouched)</div></div>
      <p class="meta">Model: … · Time: …</p>
      <p class="err">Error: generation timed out after 120s — please retry</p>
      <p class="meta">Generate button: re-enabled via finish() · AbortController fired</p>
      <div class="stateline">${stateLine({ image: "prior kept", overlay: "hidden via finish()", button: "re-enabled via finish()", meta: "…/…", error: "timeout message" })}</div>`;
        }
        d.innerHTML =
          `<h2 class="font-bold">${sc.title}</h2><p class="text-sm text-gray-600 mb-2">${sc.desc}</p>` +
          body;
        return d;
      }

      document.getElementById("variants").appendChild(frame(SCENARIOS[v]));
      renderBar();
    </script>
  </body>
</html>
