name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - "workers/**"
      - "client/**"
      - ".github/workflows/deploy-workers.yml"

  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "production"
        type: choice
        options:
          - staging
          - production
      import_credentials:
        description: "One-shot AI_ACCOUNTS → D1 import (leave off for normal deploys; a completed import cannot be re-applied)"
        required: false
        default: false
        type: boolean

  workflow_call:
    inputs:
      environment:
        description: "Deployment environment"
        required: false
        default: "production"
        type: string
    outputs:
      workers_url:
        description: "Deployed Workers base URL"
        value: ${{ jobs.deploy.outputs.workers_url }}

env:
  NODE_VERSION: "24"

jobs:
  deploy:
    name: Deploy Workers (${{ inputs.environment || github.event.inputs.environment || 'production' }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || github.event.inputs.environment || 'production' }}
    outputs:
      workers_url: ${{ steps.export_workers_url.outputs.workers_url }}
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: |
            workers/package-lock.json
            client/package-lock.json

      - name: Install dependencies
        working-directory: workers
        run: npm ci

      - name: Build the React client
        # The client is deployed as Workers Static Assets, so the build has
        # to run before the manifest is generated: wrangler uploads the
        # directory the manifest points at.
        working-directory: client
        run: |
          npm ci
          npm run build
          test -f dist/index.html

      - name: Type check
        working-directory: workers
        run: npm run check

      - name: Verify secrets are configured
        env:
          # Env indirection, not inline interpolation: a secret is never
          # substituted into the shell script text, so metacharacters in a
          # value cannot alter execution.
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "❌ ERROR: CLOUDFLARE_API_TOKEN secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "❌ ERROR: CLOUDFLARE_ACCOUNT_ID secret is not set"
            exit 1
          fi
          if [ -z "$D1_DATABASE_ID" ]; then
            echo "❌ ERROR: D1_DATABASE_ID secret is not set (one per GitHub environment; see docs/DEPLOY.md)"
            exit 1
          fi
          # Env indirection stops shell injection, but the value is also
          # written into TOML: a quote or newline could alter the generated
          # config. D1 ids are UUIDs, so enforce the shape before use.
          if [[ ! "$D1_DATABASE_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            echo "❌ ERROR: D1_DATABASE_ID is not a valid database UUID"
            exit 1
          fi
          echo "✅ Required secrets are configured"

      - name: Verify deploy token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "Verifying deploy token via GET /user/tokens/verify..."
          if ! VERIFY_RESPONSE=$(curl -sS -m 30 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify"); then
            echo "❌ Token verify request failed (deploy API/network failure, retry — token status unknown)"
            exit 1
          fi
          echo "$VERIFY_RESPONSE" | node -e '
            let s="";
            process.stdin.on("data",d=>{s+=d;});
            process.stdin.on("end",()=>{
              let j;
              try { j=JSON.parse(s); }
              catch (e) { console.error("❌ Deploy token verification failed: non-JSON response (deploy API failure, retry)"); process.exit(1); }
              const status = (j.result && j.result.status) ? j.result.status : "unknown";
              if (j.success && status === "active") {
                console.log("✅ Deploy token verified (status: active)");
              } else {
                console.error("❌ Deploy token invalid or not active (status: " + status + " — rotate CLOUDFLARE_API_TOKEN if expired/disabled). Details (no secret values):");
                console.error(JSON.stringify(j.errors || j, null, 2));
                process.exit(1);
              }
            });
          '

      - name: Set environment variables
        run: |
          ENVIRONMENT="${{ inputs.environment || github.event.inputs.environment || 'production' }}"
          echo "ENVIRONMENT=$ENVIRONMENT" >> $GITHUB_ENV

          # Determine worker name based on environment
          if [ "$ENVIRONMENT" == "staging" ]; then
            echo "WORKERS_NAME=cloudflare-image-workers-staging" >> $GITHUB_ENV
          else
            echo "WORKERS_NAME=cloudflare-image-workers" >> $GITHUB_ENV
          fi
          # No per-environment D1 name variable: migrate-apply targets the
          # PROVIDER_DB binding (stable across environments), and the binding
          # resolves to the environment's database via its database_id.

          echo "Deploying to $ENVIRONMENT as ${{ env.WORKERS_NAME }}"

      - name: Generate wrangler.toml
        working-directory: workers
        env:
          # Env indirection: the id reaches the heredoc as a shell variable,
          # never as text substituted into the script body.
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          # Generate wrangler.toml dynamically from GitHub secrets
          # This ensures single source of truth (GitHub Secrets/Terraform)
          cat > wrangler.toml << EOF
          name = "${{ env.WORKERS_NAME }}"
          account_id = "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          compatibility_date = "2025-01-01"
          main = "src/index.ts"

          # R2 Bucket binding
          [[r2_buckets]]
          binding = "IMAGE_BUCKET"
          bucket_name = "cloudflare-image-mcp-images"

          # D1 provider store binding (R1a, #71). No Worker request path
          # reads it yet — application reads land in R1b (#72). The binding
          # exists so the schema is applied and versioned ahead of that.
          [[d1_databases]]
          binding = "PROVIDER_DB"
          database_id = "$D1_DATABASE_ID"

          # Environment variables
          [vars]
          IMAGE_EXPIRY_HOURS = "24"
          # API_KEYS is set as secret via wrangler secret put

          # The React client (client/) built by the step above. The Worker
          # owns every route it serves and reaches the client's files
          # through the ASSETS binding, so an unknown path still gets the
          # Worker's own error envelope.
          [assets]
          directory = "../client/dist"
          binding = "ASSETS"
          not_found_handling = "none"
          run_worker_first = true
          EOF

          echo "✅ wrangler.toml generated successfully"
          # Only show non-sensitive parts
          echo "Worker name: ${{ env.WORKERS_NAME }}"
          echo "Bucket: cloudflare-image-mcp-images"
          echo "(wrangler.toml content hidden for security)"

      - name: Set deployment metadata
        working-directory: workers
        run: |
          # Set deployment timestamp and commit SHA
          echo "DEPLOYED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_ENV
          echo "COMMIT_SHA=${{ github.sha }}" >> $GITHUB_ENV

      - name: Check optional secrets
        run: |
          if [ -z "${{ secrets.API_KEYS }}" ]; then
            echo "ℹ️ API_KEYS not set (endpoints are public)"
          fi
          echo "✅ Secrets check completed"

      - name: Apply D1 migrations
        # Forward-only migrations: undo is D1 Time Travel, never a runner.
        # Runs before deploy so the provider store exists and is versioned
        # before the Worker boots against it.
        working-directory: workers
        run: npx wrangler d1 migrations apply PROVIDER_DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Import AI_ACCOUNTS into D1 (opt-in)
        # Opt-in, once per environment (R1b, #72). Envelopes are sealed with
        # the same PROVIDER_DATA_KEY the secret-bulk step below pushes to the
        # worker, so the sealing key and the opening key cannot drift apart.
        # A second import fails on the UNIQUE label/version guards — import
        # twice is an error, not a merge, so the re-run protection is the
        # database's, not this step's.
        if: inputs.import_credentials == true
        working-directory: workers
        env:
          # Env indirection, not inline interpolation: no token value ever
          # enters the script text, so none can reach the job log.
          AI_ACCOUNTS_VALUE: ${{ secrets.AI_ACCOUNTS }}
          PROVIDER_DATA_KEY_VALUE: ${{ secrets.PROVIDER_DATA_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # -e: a failed import must fail the step, never fall through to
          # the evidence query and report success. pipefail: the blob is
          # piped through the script, so its exit status must count.
          set -euo pipefail
          if [ -z "$AI_ACCOUNTS_VALUE" ]; then
            echo "❌ ERROR: AI_ACCOUNTS secret is not set (nothing to import)"
            exit 1
          fi
          if [ -z "$PROVIDER_DATA_KEY_VALUE" ]; then
            echo "❌ ERROR: PROVIDER_DATA_KEY secret is not set (cannot seal envelopes)"
            exit 1
          fi

          # Blob in, envelope SQL out — the script never touches the network.
          printf '%s' "$AI_ACCOUNTS_VALUE" \
            | PROVIDER_DATA_KEY="$PROVIDER_DATA_KEY_VALUE" \
              node ../scripts/import-ai-accounts.mjs > /tmp/import.sql

          # The script exits 0 with only comments when no entry has both
          # account_id and api_token; an import that writes nothing must not
          # pass as a completed one.
          if ! grep -q "INSERT INTO provider_keys" /tmp/import.sql; then
            echo "❌ ERROR: import produced no credential rows (AI_ACCOUNTS has no usable entries)"
            exit 1
          fi

          # Last gate before the SQL reaches D1: the file must carry
          # envelopes only, so no blob token value may appear in it.
          printf '%s' "$AI_ACCOUNTS_VALUE" | node -e '
            const fs = require("node:fs");
            let s = "";
            process.stdin.on("data", (d) => (s += d));
            process.stdin.on("end", () => {
              const tokens = JSON.parse(s)
                .map((a) => a && a.api_token)
                .filter(Boolean);
              const sql = fs.readFileSync("/tmp/import.sql", "utf8");
              const leaked = tokens.filter((t) => sql.includes(t));
              if (leaked.length > 0) {
                console.error("❌ ERROR: import SQL contains plaintext token material — aborting before the D1 write");
                process.exit(1);
              }
              console.log("✅ Import SQL is envelope-only (no plaintext tokens)");
            });
          '

          # Schema was applied above; now apply the envelopes.
          npx wrangler d1 execute PROVIDER_DB --remote --file /tmp/import.sql
          rm -f /tmp/import.sql

          # Import evidence for the run log: labels and enabled flags only.
          npx wrangler d1 execute PROVIDER_DB --remote \
            --command "SELECT label, enabled FROM provider_keys"

      - name: Deploy to Cloudflare Workers
        # Direct wrangler invocation (no third-party action on the deploy
        # path): same credentials the secret-put steps below already use.
        # Wrangler reads CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID from env.
        working-directory: workers
        run: npx wrangler deploy --name "$WORKERS_NAME"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set Worker secrets
        # One bulk upload instead of a put-per-secret: adding the next secret
        # (R1b/R2 will add more) is one env line, not a new if-block. Values
        # arrive via env indirection so none appear on the command line;
        # unset optionals are omitted from the payload. Bulk puts each key
        # without touching unspecified secrets.
        working-directory: workers
        run: |
          node -e '
            const required = {
              DEPLOYED_AT: process.env.DEPLOYED_AT,
              COMMIT_SHA: process.env.COMMIT_SHA,
            };
            // Runtime secrets only. CLOUDFLARE_ACCOUNT_ID/CLOUDFLARE_API_TOKEN
            // and AI_ACCOUNTS are deliberately absent: ADR-001 made inference
            // credentials database-only, so the Worker reads none of them
            // (src/types.ts declares no AI_ACCOUNTS; src/services/pool-loader
            // .test.ts pins that legacy vars with an empty store yield zero
            // credentials). They stay GitHub secrets because this workflow
            // itself needs the CF pair for wrangler, and AI_ACCOUNTS is the
            // one-shot D1 import source — shipping them to the Worker only
            // widened blast radius for values nothing reads.
            const optional = {
              API_KEYS: process.env.API_KEYS_VALUE,
              PROVIDER_DATA_KEY: process.env.PROVIDER_DATA_KEY_VALUE,
              ADMIN_API_KEY: process.env.ADMIN_API_KEY_VALUE,
              TZ: process.env.TZ_VALUE,
            };
            for (const [k, v] of Object.entries(optional)) if (v) required[k] = v;
            process.stdout.write(JSON.stringify(required));
          ' | npx wrangler secret bulk --name ${{ env.WORKERS_NAME }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOYED_AT: ${{ env.DEPLOYED_AT }}
          COMMIT_SHA: ${{ github.sha }}
          API_KEYS_VALUE: ${{ secrets.API_KEYS }}
          PROVIDER_DATA_KEY_VALUE: ${{ secrets.PROVIDER_DATA_KEY }}
          ADMIN_API_KEY_VALUE: ${{ secrets.ADMIN_API_KEY }}
          TZ_VALUE: ${{ secrets.TZ }}

      - name: Derive Workers URL
        run: |
          echo "Fetching account workers.dev subdomain via Cloudflare API..."
          SUBDOMAIN=$(curl -sS \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/workers/subdomain" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{const j=JSON.parse(s); if(!j.success){ console.error(JSON.stringify(j.errors||j, null, 2)); process.exit(1);} console.log(j.result?.subdomain||'');});")

          if [ -z "$SUBDOMAIN" ]; then
            echo "❌ Could not derive workers.dev subdomain"
            exit 1
          fi

          WORKERS_URL="https://${{ env.WORKERS_NAME }}.${SUBDOMAIN}.workers.dev"
          echo "WORKERS_URL=$WORKERS_URL" >> $GITHUB_ENV
          echo "✅ Workers URL: $WORKERS_URL"

      - name: Export Workers URL
        id: export_workers_url
        run: |
          echo "workers_url=$WORKERS_URL" >> $GITHUB_OUTPUT

      # NOTE: This workflow does not create a GitHub Deployment object, so deployment statuses are not applicable.
      # Leaving this step disabled avoids failing deployments with 404s.
      # - name: Update deployment status
      #   uses: actions/github-script@v7
      #   with:
      #     script: |
      #       const workersUrl = process.env.WORKERS_URL;
      #       const deploymentId = context.payload.deployment?.id;
      #
      #       if (!deploymentId) {
      #         core.info('No GitHub deployment id present; skipping deployment status update.');
      #         return;
      #       }
      #
      #       if (workersUrl) {
      #         await github.rest.repos.createDeploymentStatus({
      #           owner: context.repo.owner,
      #           repo: context.repo.repo,
      #           deployment_id: deploymentId,
      #           state: 'success',
      #           environment_url: workersUrl,
      #           log_url: `https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}`,
      #         });
      #       }

      - name: Deployment summary
        if: success()
        run: |
          echo "## ✅ Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ env.ENVIRONMENT }}" >> $GITHUB_STEP_SUMMARY
          echo "**Worker Name:** ${{ env.WORKERS_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "**Workers URL:** ${{ env.WORKERS_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Endpoints Available" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: ${{ env.WORKERS_URL }}/" >> $GITHUB_STEP_SUMMARY
          echo "- OpenAI API: ${{ env.WORKERS_URL }}/v1/images/generations" >> $GITHUB_STEP_SUMMARY
          echo "- MCP HTTP: ${{ env.WORKERS_URL }}/mcp" >> $GITHUB_STEP_SUMMARY
          echo "- MCP SSE: ${{ env.WORKERS_URL }}/mcp?transport=sse" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Secrets Configured (role each secret serves)" >> $GITHUB_STEP_SUMMARY
          echo "- CLOUDFLARE_API_TOKEN: ✅ Configured (role: management API / deploy token; pre-flight verified)" >> $GITHUB_STEP_SUMMARY
          echo "- CLOUDFLARE_ACCOUNT_ID: ✅ Configured (role: Cloudflare account for deploy/migrations; not a runtime inference fallback — ADR-001)" >> $GITHUB_STEP_SUMMARY
          echo "- API_KEYS: ${{ secrets.API_KEYS != '' && '✅ Configured (role: endpoint auth — MCP + OpenAI + frontend)' || '❌ Missing (role: endpoint auth — endpoints are public)' }}" >> $GITHUB_STEP_SUMMARY
          echo "- AI_ACCOUNTS: ${{ secrets.AI_ACCOUNTS != '' && '✅ Set (role: one-shot D1 import source only — never a runtime credential; ADR-001)' || 'ℹ️ Not set (role: one-shot D1 import source only)' }}" >> $GITHUB_STEP_SUMMARY
          echo "- AI_ACCOUNTS → D1 import: ${{ inputs.import_credentials == true && '✅ Ran this deploy (envelopes applied; row evidence above)' || 'ℹ️ Not run (opt-in via the import_credentials workflow_dispatch input)' }}" >> $GITHUB_STEP_SUMMARY
          echo "- D1 provider store: binding PROVIDER_DB (role: provider schema/migrations applied before deploy; /api/admin/* reads and writes it — R2 #74)" >> $GITHUB_STEP_SUMMARY
          echo "- PROVIDER_DATA_KEY: ${{ secrets.PROVIDER_DATA_KEY != '' && '✅ Configured (role: AES-GCM envelope data key — consumed from R1b)' || 'ℹ️ Not set (role: AES-GCM envelope data key — needed before R1b reads D1)' }}" >> $GITHUB_STEP_SUMMARY
          echo "- ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY != '' && '✅ Configured (role: management key gating /api/admin/*)' || 'ℹ️ Not set (role: management key — admin routes fail closed with 403)' }}" >> $GITHUB_STEP_SUMMARY
          echo "- TZ: ${{ secrets.TZ != '' && '✅ Configured (role: runtime logging timezone)' || 'ℹ️ Not set (role: runtime logging timezone — defaults to UTC)' }}" >> $GITHUB_STEP_SUMMARY

      - name: Cleanup sensitive files
        if: always()
        working-directory: workers
        run: |
          # Explicitly remove wrangler.toml to ensure no credential leakage
          # Note: account_id is not secret (it's in the public URL), but we clean up anyway
          rm -f wrangler.toml
          echo "✅ Cleaned up wrangler.toml"

      - name: Notify on failure
        if: failure()
        run: |
          echo "## ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the logs above for error details." >> $GITHUB_STEP_SUMMARY
