name: E2E Tests

on:
  # Weekly canary tier (monitor, not gate): contract + @smoke +
  # @drift (~8 live calls) proving credential chain, model availability,
  # and SDK transport against the deployed Worker. Provider models change
  # rarely, so weekly is enough signal. Failures here page the on-call
  # via the Actions notification, they never block a PR.
  # The retired 36-test @slow matrix is superseded by the hermetic
  # contract suite (workers/src/endpoints/openai-contract.test.ts).
  schedule:
    - cron: "0 2 * * 1"
  # Manual trigger for testing specific deployments
  workflow_dispatch:
    inputs:
      environment:
        description: "Test environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
      test_pattern:
        description: "Test file pattern (e.g., tests/api/mcp/mcp-sdk.spec.ts)"
        required: false
        default: ""
        type: string
      full_matrix:
        description: "Include @slow generation tests (E2E_SLOW=1)"
        required: false
        default: false
        type: boolean
      custom_url:
        description: "Custom Workers URL (optional - overrides auto-constructed URL)"
        required: false
        default: ""
        type: string

  # Merge gate: contract suite + 2 @smoke canaries (1 live generation +
  # 1 MCP run_model) on release-integration PRs to main, where the fast
  # PR check (pr-checks.yml) is insufficient signal. The weekly schedule
  # runs the canary tier only (contract + @smoke + @drift, ~8 live calls)
  # as a drift monitor; retired shape tests live hermetically in
  # workers/src/endpoints/openai-contract.test.ts.
  # Feature PRs skip E2E (add the `e2e` label for an opt-in smoke run:
  # contract suite + 2 @smoke canaries; full @slow matrix is dispatch-only).
  # Note: no `paths` filter here — it would also filter `labeled`
  # events, silently blocking the opt-in label. Job-level `if` guards
  # below are the real scoping mechanism; non-gated PRs skip in seconds.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - main

  workflow_call:
    inputs:
      environment:
        description: "Test environment"
        required: false
        default: "staging"
        type: string
      test_pattern:
        description: "Test file pattern"
        required: false
        default: ""
        type: string
      full_matrix:
        description: "Include @slow generation tests (E2E_SLOW=1)"
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: "24"
jobs:
  deploy_staging:
    name: Deploy staging (for E2E)
    # Skip on feature PRs: full E2E is the merge gate for
    # release-integration branches (prerelease/*, release/*) and
    # opt-in runs labeled `e2e`. Fast feedback lives in pr-checks.yml.
    if: >-
      (inputs.environment || 'staging') == 'staging' &&
      (github.event_name != 'pull_request' ||
      startsWith(github.head_ref, 'prerelease/') ||
      startsWith(github.head_ref, 'release/') ||
      contains(github.event.pull_request.labels.*.name, 'e2e')) &&
      (github.event_name != 'pull_request' ||
      (github.event.pull_request && github.event.pull_request.head.repo.full_name == github.repository))
    uses: ./.github/workflows/deploy-workers.yml
    with:
      environment: staging
    secrets: inherit

  e2e-tests:
    name: E2E Tests (${{ inputs.environment || 'staging' }})
    runs-on: ubuntu-latest
    needs: [deploy_staging]
    # Full generation matrix needs headroom; a hung Playwright/browser
    # step must fail the gate, never hold the required check indefinitely.
    timeout-minutes: 30
    # Same merge-gate guard as deploy_staging; non-gated feature PRs
    # skip without failure so the suite stays non-blocking there.
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
      startsWith(github.head_ref, 'prerelease/') ||
      startsWith(github.head_ref, 'release/') ||
      contains(github.event.pull_request.labels.*.name, 'e2e')) &&
      (github.event_name != 'pull_request' ||
      (github.event.pull_request && github.event.pull_request.head.repo.full_name == github.repository)) &&
      ((inputs.environment || 'staging') != 'staging' || needs.deploy_staging.result == 'success')
    environment: ${{ inputs.environment || 'staging' }}
    permissions:
      contents: read
      checks: write
      pull-requests: write
    env:
      TEST_TARGET: ${{ inputs.environment || 'staging' }}
      # TEST_BASE_URL is derived in a step below (or directly set via custom_url)
      TEST_BASE_URL: ${{ inputs.custom_url }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      API_KEY: ${{ secrets.API_KEY }}
      API_KEYS: ${{ secrets.API_KEYS }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify environment configuration
        run: |
          echo "Environment: ${{ env.TEST_TARGET }}"
          echo "Custom URL provided: ${{ inputs.custom_url != '' && 'yes' || 'no' }}"
          echo "API Key: ${{ env.API_KEY != '' && '✅ Configured' || (env.API_KEYS != '' && '✅ Configured (API_KEYS)') || '⚠️ Not configured (tests may fail if auth required)' }}"

          if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "❌ ERROR: CLOUDFLARE_ACCOUNT_ID secret is not set"
            echo "This is required to derive the Workers URL."
            exit 1
          fi
          echo "✅ CLOUDFLARE_ACCOUNT_ID configured"

          if [ -n "${{ inputs.custom_url }}" ]; then
            echo "✅ Using custom Workers URL"
          else
            echo "✅ Workers URL will be derived from account ID"
          fi

      - name: Derive base URL
        run: |
          if [ -n "${{ inputs.custom_url }}" ]; then
            echo "TEST_BASE_URL=${{ inputs.custom_url }}" >> $GITHUB_ENV
          elif [ -n "${{ needs.deploy_staging.outputs.workers_url }}" ]; then
            echo "TEST_BASE_URL=${{ needs.deploy_staging.outputs.workers_url }}" >> $GITHUB_ENV
          else
            if [ "${{ env.TEST_TARGET }}" = "staging" ]; then
              WORKER_NAME="cloudflare-image-workers-staging"
            else
              WORKER_NAME="cloudflare-image-workers"
            fi

            echo "Fetching account workers.dev subdomain via Cloudflare API..."
            SUBDOMAIN=$(curl -sS \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
              | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{const j=JSON.parse(s); if(!j.success){ console.error(JSON.stringify(j.errors||j, null, 2)); process.exit(1);} console.log(j.result?.subdomain||'');});")

            if [ -z "$SUBDOMAIN" ]; then
              echo "❌ Could not derive workers.dev subdomain"
              exit 1
            fi

            echo "✅ workers.dev subdomain: $SUBDOMAIN"
            echo "TEST_BASE_URL=https://${WORKER_NAME}.${SUBDOMAIN}.workers.dev" >> $GITHUB_ENV
          fi

          echo "Resolved TEST_BASE_URL=$(cat $GITHUB_ENV | grep '^TEST_BASE_URL=' | cut -d'=' -f2-)"

      - name: Derive API key
        run: |
          # Prefer API_KEYS (source of truth for the Worker) if present.
          # This avoids mismatches when API_KEY is stale/different from the deployed API_KEYS.
          if [ -n "$API_KEYS" ]; then
            # Use the first key if a comma-separated list is provided
            FIRST_KEY=$(echo "$API_KEYS" | cut -d',' -f1 | xargs)
            echo "API_KEY_EFFECTIVE=$FIRST_KEY" >> $GITHUB_ENV
          elif [ -n "$API_KEY" ]; then
            echo "API_KEY_EFFECTIVE=$API_KEY" >> $GITHUB_ENV
          else
            echo "API_KEY_EFFECTIVE=" >> $GITHUB_ENV
          fi
        env:
          API_KEY: ${{ env.API_KEY }}
          API_KEYS: ${{ env.API_KEYS }}
          # API_KEY_EFFECTIVE is written to $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E dependencies
        run: |
          cd e2e
          npm ci

      - name: Install Playwright browsers
        run: |
          cd e2e
          npx playwright install --with-deps chromium

      - name: Smoke check /health
        run: |
          echo "Testing /health at: $TEST_BASE_URL/health"

          # Dump DNS for visibility
          echo "DNS lookup:"
          node -e "const {hostname}=new URL(process.env.TEST_BASE_URL); require('dns').lookup(hostname,(e,a,f)=>{ console.log(e?e.message:{address:a,family:f});});"

          # Try to reach the endpoint (no auth required for /health)
          curl -sS -D /tmp/headers.txt -o /tmp/body.txt "$TEST_BASE_URL/health" || true
          echo "Status line: $(head -n 1 /tmp/headers.txt || true)"
          echo "Response body:"
          cat /tmp/body.txt || true

          # Fail fast if not 200; this provides a clearer error than Playwright fetch failed
          if ! grep -q "^HTTP/.* 200" /tmp/headers.txt; then
            echo "❌ /health is not reachable (expected HTTP 200)"
            exit 1
          fi
          echo "✅ /health reachable"

      - name: Run E2E tests
        run: |
          cd e2e
          # Tier semantics live in e2e/lib/tiers.ts (tier → grep+timeout).
          # This block only *selects* the tier name by trigger so the YAML
          # never re-encodes the grep/timeout map:
          # - test_pattern: forced slow tier so @slow targets are reachable
          # - schedule: canary tier (contract + @smoke + @drift, ~8 live
          #   calls, monitor-only, never a PR gate)
          # - pull_request: smoke tier on gated PRs (contract + 2 @smoke
          #   canaries, ~2 live calls). PR events cannot set inputs, so an
          #   unset full_matrix on a PR means "gated run", not
          #   "caller wants contract-only".
          # - full_matrix input: slow tier (opt-in @slow incl. skipped
          #   manifests), dispatch/call only.
          # - default: contract tier (0 live calls).
          if [ -n "${{ inputs.test_pattern }}" ]; then
            echo "Running specific test pattern: ${{ inputs.test_pattern }} (forced slow tier so @slow targets are reachable)"
            npx playwright test ${{ inputs.test_pattern }} --reporter=list,junit,html
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Running weekly canary tier (monitor-only): contract + @smoke + @drift"
            npx playwright test --reporter=list,junit,html
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Running contract suite + @smoke canaries: 2 live inference calls"
            npx playwright test --reporter=list,junit,html
          elif [ "${{ inputs.full_matrix }}" = "true" ]; then
            echo "Running full matrix: contract + @slow generation tests"
            npx playwright test --reporter=list,junit,html
          else
            echo "Running fast contract tests (@slow generation tests skipped; use full_matrix to include)"
            npx playwright test --reporter=list,junit,html
          fi
        env:
          # Single tier name; grep+timeout come from e2e/lib/tiers.ts.
          # Legacy flags stay set for backward compat (local E2E_SLOW=1
          # invocations, manual `gh workflow run` without full_matrix)
          # but E2E_TIER wins in getTier() when non-empty.
          E2E_TIER: ${{ inputs.test_pattern != '' && 'slow' || github.event_name == 'schedule' && 'canary' || github.event_name == 'pull_request' && 'smoke' || inputs.full_matrix && 'slow' || 'contract' }}
          E2E_SLOW: ${{ inputs.full_matrix && '1' || '' }}
          E2E_SMOKE: ${{ (github.event_name == 'pull_request' || github.event_name == 'schedule') && '1' || '' }}
          E2E_DRIFT: ${{ github.event_name == 'schedule' && '1' || '' }}
          # NOTE: TEST_BASE_URL is derived at runtime via $GITHUB_ENV.
          # Do not override it here with ${{ env.TEST_BASE_URL }} (expressions are evaluated before runtime env updates).
          API_KEY: ${{ env.API_KEY_EFFECTIVE }}
          CI: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ env.TEST_TARGET }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
            e2e/junit-results.xml
          retention-days: 30

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ env.TEST_TARGET }}-${{ github.run_id }}
          path: e2e/test-results/**/*.png
          retention-days: 7

      - name: Comment PR with test results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'e2e/junit-results.xml';

            if (!fs.existsSync(path)) {
              console.log('No JUnit results found');
              return;
            }

            // Parse basic stats from JUnit XML
            const content = fs.readFileSync(path, 'utf8');
            const testsMatch = content.match(/tests="(\d+)"/);
            const failuresMatch = content.match(/failures="(\d+)"/);
            const errorsMatch = content.match(/errors="(\d+)"/);

            const tests = testsMatch ? parseInt(testsMatch[1]) : 0;
            const failures = failuresMatch ? parseInt(failuresMatch[1]) : 0;
            const errors = errorsMatch ? parseInt(errorsMatch[1]) : 0;
            const passed = tests - failures - errors;

            const status = failures === 0 && errors === 0 ? '✅ PASSED' : '❌ FAILED';

            const body = `## E2E Test Results ${status}

            **Environment:** ${process.env.TEST_TARGET}

            | Metric | Count |
            |--------|-------|
            | Total Tests | ${tests} |
            | Passed | ${passed} |
            | Failures | ${failures} |
            | Errors | ${errors} |

            <details>
            <summary>View Details</summary>

            - [View Playwright Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - Download artifacts from the Actions summary

            </details>
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Fail workflow if tests failed
        if: failure()
        run: |
          echo "E2E tests failed!"
          exit 1

  cleanup-staging:
    name: Cleanup Staging Worker
    needs: [deploy_staging, e2e-tests]
    # Single wrangler delete call; bound it so a hung delete cannot hold
    # the merge check running after E2E completes.
    timeout-minutes: 10
    # Only runs when deploy_staging ran (merge-gate or opt-in PRs).
    # Skipped feature PRs never deploy, so there is nothing to delete.
    if: always() && (inputs.environment || 'staging') == 'staging' && needs.deploy_staging.result == 'success' && (github.event_name != 'pull_request' || startsWith(github.head_ref, 'prerelease/') || startsWith(github.head_ref, 'release/') || contains(github.event.pull_request.labels.*.name, 'e2e')) && (github.event_name != 'pull_request' || (github.event.pull_request && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: workers/package-lock.json

      - name: Install Wrangler
        working-directory: workers
        run: npm install -g wrangler

      - name: Delete Staging Worker
        working-directory: workers
        run: |
          echo "Deleting staging worker..."
          wrangler delete --name cloudflare-image-workers-staging --force
          echo "✅ Staging worker deleted successfully"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
